<svg width="680" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Phase 1 decision flow: local pooling within a column</title>
<desc>For each column: if clients are fewer than target, the whole column becomes a fragment for phase 2; otherwise split into contiguous target-sized groups, distribute leftovers evenly up to max, trim overflow, and emit complete pools.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">For each column</text>
<text class="ts" x="340" y="53" text-anchor="middle" dominant-baseline="central">clients sorted by chain position</text>

<line x1="340" y1="64" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>

<rect x="250" y="100" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central" fill="#633806">Column size &#8805; T ?</text>

<line x1="250" y1="122" x2="152" y2="122" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="112" text-anchor="middle">no</text>
<line x1="340" y1="144" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="164">yes</text>

<rect x="42" y="100" width="106" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="95" y="116" text-anchor="middle" dominant-baseline="central" fill="#712B13">Fragment</text>
<text class="ts" x="95" y="133" text-anchor="middle" dominant-baseline="central" fill="#993C1D">send to Phase 2</text>

<rect x="230" y="184" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="202" text-anchor="middle" dominant-baseline="central">Split into &#8970;n/T&#8971; groups</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">contiguous runs along the chain</text>

<line x1="340" y1="240" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

<rect x="220" y="276" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="294" text-anchor="middle" dominant-baseline="central">Distribute leftovers evenly</text>
<text class="ts" x="340" y="314" text-anchor="middle" dominant-baseline="central">top groups up, never below T</text>

<line x1="340" y1="332" x2="340" y2="364" class="arr" marker-end="url(#arrow)"/>

<rect x="235" y="368" width="210" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="390" text-anchor="middle" dominant-baseline="central" fill="#633806">Any group over M ?</text>

<line x1="445" y1="390" x2="528" y2="390" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="487" y="380" text-anchor="middle">yes</text>
<line x1="340" y1="412" x2="340" y2="444" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="430">no</text>

<rect x="532" y="368" width="118" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="591" y="384" text-anchor="middle" dominant-baseline="central" fill="#712B13">Trim to M</text>
<text class="ts" x="591" y="401" text-anchor="middle" dominant-baseline="central" fill="#993C1D">excess &#8594; Phase 2</text>

<rect x="250" y="448" width="180" height="26" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="461" text-anchor="middle" dominant-baseline="central" fill="#085041">Complete pools [T&#8230;M]</text>
</svg>
