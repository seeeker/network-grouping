<svg width="680" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Phase 2 decision flow: mandatory fragment completion</title>
<desc>Take the smallest fragment, gather donor candidates from other fragments and surplus clients, sort by tree distance with incomplete-before-surplus as tiebreaker, absorb nearest donors until target is reached or candidates run out; completed fragments become pools, exhausted ones are flagged as availability defects, then leftover spares top pools toward max.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>

<rect x="235" y="20" width="210" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central" fill="#712B13">Fragments from Phase 1</text>
<text class="ts" x="340" y="53" text-anchor="middle" dominant-baseline="central" fill="#993C1D">each below T &#8212; must complete</text>

<line x1="340" y1="64" x2="340" y2="96" class="arr" marker-end="url(#arrow2)"/>

<rect x="245" y="100" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">Pick smallest fragment</text>
<text class="ts" x="340" y="133" text-anchor="middle" dominant-baseline="central">hardest to complete first</text>

<line x1="340" y1="144" x2="340" y2="176" class="arr" marker-end="url(#arrow2)"/>

<rect x="215" y="180" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="198" text-anchor="middle" dominant-baseline="central">Gather donor candidates</text>
<text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">other fragments + pool surplus (kept &#8805; T)</text>

<line x1="340" y1="236" x2="340" y2="268" class="arr" marker-end="url(#arrow2)"/>

<rect x="205" y="272" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Sort by tree distance</text>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central" fill="#534AB7">tiebreak: fragment donors before surplus</text>

<line x1="340" y1="328" x2="340" y2="360" class="arr" marker-end="url(#arrow2)"/>

<rect x="225" y="364" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="340" y="382" text-anchor="middle" dominant-baseline="central">Absorb nearest donors</text>
<text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">until size &#8805; T, never past M</text>

<line x1="340" y1="420" x2="340" y2="452" class="arr" marker-end="url(#arrow2)"/>

<rect x="260" y="456" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="478" text-anchor="middle" dominant-baseline="central" fill="#633806">Reached T ?</text>

<line x1="260" y1="478" x2="172" y2="478" class="arr" marker-end="url(#arrow2)"/>
<text class="ts" x="215" y="468" text-anchor="middle">yes</text>
<line x1="420" y1="478" x2="508" y2="478" class="arr" marker-end="url(#arrow2)"/>
<text class="ts" x="463" y="468" text-anchor="middle">no</text>

<rect x="40" y="456" width="132" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="106" y="472" text-anchor="middle" dominant-baseline="central" fill="#085041">Complete pool</text>
<text class="ts" x="106" y="489" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">minimal span kept</text>

<rect x="512" y="456" width="140" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text class="th" x="582" y="472" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Flag defect</text>
<text class="ts" x="582" y="489" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">needs topology fix</text>

<path d="M106 456 L106 122 L245 122" class="arr" marker-end="url(#arrow2)"/>
<text class="ts" x="106" y="290" text-anchor="middle">repeat while</text>
<text class="ts" x="106" y="306" text-anchor="middle">fragments remain</text>

<text class="ts" x="340" y="536" text-anchor="middle">Then Phase 3: remaining spares join the nearest pool below M (redundancy top-up)</text>
</svg>
